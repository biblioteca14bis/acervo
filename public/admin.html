<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Área da equipe | Biblioteca</title>
<meta name="theme-color" content="#0B0B0F">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>

<header class="topbar">
  <div class="topbar-in">
    <a class="marca" href="index.html">
      <span class="marca-ponto" aria-hidden="true"></span>
      <span class="marca-nome" id="nome-biblioteca">Biblioteca</span>
      <span class="marca-escola">Área da equipe</span>
    </a>
    <nav aria-label="Principal">
      <a class="nav-link" href="index.html">Acervo</a>
      <button type="button" class="botao-suave" id="sair" hidden>Sair</button>
    </nav>
  </div>
</header>

<!-- Entrar -->
<main class="admin login" id="tela-login" hidden>
  <h1>Entrar</h1>
  <form class="bloco form" id="form-login">
    <label class="campo largo">E-mail
      <input type="email" name="email" autocomplete="username" required>
    </label>
    <label class="campo largo">Senha
      <input type="password" name="senha" autocomplete="current-password" required>
    </label>
    <button class="botao largo" type="submit">Entrar</button>
    <p class="mensagem largo" id="msg-login" role="status"></p>
  </form>
</main>

<!-- Painel -->
<main class="admin" id="tela-app" hidden>
  <h1>Painel da equipe</h1>

  <div class="abas" role="tablist" aria-label="Seções">
    <button type="button" role="tab" id="aba-emprestimos" aria-selected="true" aria-controls="painel-emprestimos">Empréstimos</button>
    <button type="button" role="tab" id="aba-livros" aria-selected="false" aria-controls="painel-livros">Livros</button>
  </div>

  <!-- Empréstimos -->
  <section id="painel-emprestimos" role="tabpanel" aria-labelledby="aba-emprestimos" class="admin-secao">
    <form class="bloco" id="form-emprestimo">
      <h2>Registrar empréstimo</h2>
      <div class="form">
        <label class="campo largo">Livro
          <input name="livro" list="lista-livros" placeholder="Digite o tombo ou o título" autocomplete="off" required>
          <datalist id="lista-livros"></datalist>
        </label>
        <label class="campo">Aluno
          <input name="aluno" required>
        </label>
        <label class="campo">Turma
          <input name="turma" placeholder="Ex.: 9B">
        </label>
        <label class="campo">Devolução prevista
          <input type="date" name="devolucao" required>
        </label>
        <button class="botao" type="submit">Registrar empréstimo</button>
      </div>
      <p class="mensagem" id="msg-emprestimo" role="status"></p>
    </form>

    <div class="bloco" style="margin-top: 24px">
      <h2>Emprestados agora</h2>
      <label class="campo" style="margin-bottom: 14px">Filtrar
        <input type="search" id="filtro-emprestimos" placeholder="Aluno, turma ou livro">
      </label>
      <div class="linhas" id="lista-emprestimos"></div>
    </div>
  </section>

  <!-- Livros -->
  <section id="painel-livros" role="tabpanel" aria-labelledby="aba-livros" class="admin-secao" hidden>
    <form class="bloco" id="form-livro">
      <h2>Cadastrar livro</h2>
      <div class="form">
        <label class="campo">Tombo
          <input name="tombo" required>
        </label>
        <label class="campo largo">Título
          <input name="titulo" required>
        </label>
        <label class="campo">Autor
          <input name="autor">
        </label>
        <label class="campo">Editora
          <input name="editora">
        </label>
        <label class="campo">Gênero
          <input name="genero">
        </label>
        <label class="campo">Estante
          <input name="estante">
        </label>
        <label class="campo">Prateleira
          <input name="prateleira">
        </label>
        <label class="campo">Exemplares
          <input type="number" name="exemplares" min="1" value="1" required>
        </label>
        <button class="botao" type="submit">Cadastrar livro</button>
      </div>
      <p class="mensagem" id="msg-livro" role="status"></p>
    </form>

    <div class="bloco" style="margin-top: 24px">
      <h2>Acervo</h2>
      <label class="campo" style="margin-bottom: 14px">Filtrar
        <input type="search" id="filtro-livros" placeholder="Tombo, título ou autor">
      </label>
      <div class="linhas" id="lista-livros-admin"></div>
    </div>
  </section>
</main>

<script type="module" src="js/admin.js"></script>
</body>
</html>
