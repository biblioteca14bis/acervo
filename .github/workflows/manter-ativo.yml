name: Manter Supabase ativo

on:
  schedule:
    - cron: "0 12 * * 1,4"
  workflow_dispatch:

jobs:
  consulta:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SUPABASE_URL: https://mpkqhduhunkgkrpvywxx.supabase.co
      SUPABASE_PUBLISHABLE_KEY: sb_publishable_k8svD4eAxaYuz2zqiWLdNA_NcashR4-
    steps:
      - name: Consulta leve ao catálogo
        run: |
          curl --fail --silent --show-error --retry 3 --retry-delay 10 \
            "$SUPABASE_URL/rest/v1/catalogo?select=id&limit=1" \
            -H "apikey: $SUPABASE_PUBLISHABLE_KEY"
